<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Timetable Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>Online Timetable Generator</h1>
      <p>Create class timetables instantly and download them as PDF.</p>
    </header>

    <section class="card form-card">
      <h2>Enter Timetable Details</h2>

      <div class="grid">
        <div class="input-group full">
          <label for="classes">Class Names (comma separated)</label>
          <textarea id="classes" placeholder="Example: BCA-1, BCA-2, BCA-3"></textarea>
        </div>

        <div class="input-group full">
          <label for="subjects">Subject Names (comma separated)</label>
          <textarea id="subjects" placeholder="Example: Math, Java, DBMS, OS, AI"></textarea>
        </div>

        <div class="input-group full">
          <label for="teachers">Teacher Names (comma separated)</label>
          <textarea id="teachers" placeholder="Example: Rahul Sir, Anjali Ma'am, Mohit Sir"></textarea>
        </div>

        <div class="input-group">
          <label for="days">Working Days (comma separated)</label>
          <input type="text" id="days" placeholder="Example: Monday, Tuesday, Wednesday, Thursday, Friday" />
        </div>

        <div class="input-group">
          <label for="periods">Periods Per Day</label>
          <input type="number" id="periods" min="1" max="10" placeholder="Example: 5" />
        </div>
      </div>

      <div class="button-row">
        <button id="generateBtn">Generate Timetable</button>
        <button id="downloadBtn" class="secondary">Download PDF</button>
        <button id="resetBtn" class="danger">Reset</button>
      </div>
    </section>

    <section class="card output-card">
      <div class="output-header">
        <h2>Generated Timetable</h2>
        <p id="statusText">Fill the details and click Generate Timetable.</p>
      </div>
      <div id="timetableOutput"></div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
